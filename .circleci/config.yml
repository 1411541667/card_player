version: 2.1

orbs:
  win: circleci/windows@5.0.0

jobs:
  web-verify:
    docker:
      - image: cimg/node:22.14.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-node22-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-npm-node22-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run check:no-unity
      - run: npm run content:check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - store_artifacts:
          path: dist
          destination: web-dist

  windows-package:
    executor:
      name: win/default
      size: medium
    steps:
      - checkout
      - run:
          name: Verify Windows toolchain
          command: |
            node --version
            dotnet --version
      - run:
          name: Install Inno Setup
          command: choco install innosetup --yes --no-progress
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build Windows package
          command: npm run package:windows
      - store_artifacts:
          path: release
          destination: windows-release

workflows:
  verify-and-package:
    jobs:
      - web-verify:
          filters:
            tags:
              only: /^v.*/
      - windows-package:
          requires:
            - web-verify
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
